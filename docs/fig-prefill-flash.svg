<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1060" height="860" viewBox="0 0 1060 860" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
    <path d="M1054,20L1054,840C1054,847.727 1047.727,854 1040,854L20,854C12.273,854 6,847.727 6,840L6,20C6,12.273 12.273,6 20,6L1040,6C1047.727,6 1054,12.273 1054,20Z" style="fill:white;stroke:rgb(226,232,240);stroke-width:2px;"/>

    <text x="36" y="46" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:24px;fill:rgb(15,23,42);">Prefill flash attention — inside the hot step, where the 8× forms</text>
    <text x="36" y="72" style="font-family:'ArialMT','Arial',sans-serif;font-size:13px;fill:rgb(100,116,139);">Identical flash dataflow on both stacks: sweep K/V blocks — S = Q·Kᵀ → online softmax → O += P·V. Below: what one block actually costs, substep by substep.</text>

    <!-- header row -->
    <rect x="44" y="92" width="148" height="34" rx="5" style="fill:rgb(248,250,252);stroke:rgb(203,213,225);stroke-width:1px;"/>
    <text x="56" y="108" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:11px;fill:rgb(100,116,139);">FLASH LOOP</text>
    <text x="56" y="120" style="font-family:'ArialMT','Arial',sans-serif;font-size:9.5px;fill:rgb(148,163,184);">32-key block, both stacks</text>
    <rect x="202" y="92" width="416" height="34" rx="5" style="fill:rgb(239,246,255);stroke:rgb(37,99,235);stroke-width:1.8px;"/>
    <text x="214" y="114" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:14px;fill:rgb(29,78,216);">little-gemma — 0.67 s attention / pass</text>
    <rect x="628" y="92" width="396" height="34" rx="5" style="fill:rgb(255,247,237);stroke:rgb(234,88,12);stroke-width:1.8px;"/>
    <text x="640" y="114" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:14px;fill:rgb(194,65,12);">llama.cpp — 0.08 s attention / pass</text>

    <!-- row 1: K block arrives -->
    <rect x="44" y="134" width="148" height="60" rx="5" style="fill:rgb(248,250,252);stroke:rgb(203,213,225);stroke-width:1px;"/>
    <text x="56" y="158" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(51,65,85);">K block arrives</text>
    <rect x="202" y="134" width="416" height="60" rx="5" style="fill:rgb(251,253,255);stroke:rgb(191,219,254);stroke-width:1.2px;"/>
    <text x="214" y="155" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">nothing in flight — K fragments are fetched from the KV ring on</text>
    <text x="214" y="170" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">demand, inside the MMA loop; the first MMAs of every block eat</text>
    <text x="214" y="185" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">the full DRAM latency</text>
    <rect x="628" y="134" width="396" height="60" rx="5" style="fill:rgb(255,252,246);stroke:rgb(254,215,170);stroke-width:1.2px;"/>
    <text x="640" y="155" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">already in shared — cp.async copied this block's K and V during</text>
    <text x="640" y="170" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">the previous block's P·V (double-buffered); the tensor cores</text>
    <text x="640" y="185" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">never wait for it</text>

    <!-- row 2: S = Q.Kt MMA -->
    <rect x="44" y="202" width="148" height="60" rx="5" style="fill:rgb(255,247,237);stroke:rgb(245,158,11);stroke-width:1.6px;"/>
    <text x="56" y="228" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(180,83,9);">S = Q·Kᵀ</text>
    <text x="56" y="243" style="font-family:'ArialMT','Arial',sans-serif;font-size:10.5px;fill:rgb(180,83,9);">tensor-core MMA</text>
    <rect x="202" y="202" width="416" height="60" rx="5" style="fill:rgb(251,253,255);stroke:rgb(191,219,254);stroke-width:1.2px;"/>
    <text x="214" y="223" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">hand-issued fragment loads: 4 shared reads (Q) + 2 global reads</text>
    <text x="214" y="238" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">(K) per MMA ≈ 5 memory instructions each; a warp computes one</text>
    <text x="214" y="253" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">q-tile × k-tile of S</text>
    <rect x="628" y="202" width="396" height="60" rx="5" style="fill:rgb(255,252,246);stroke:rgb(254,215,170);stroke-width:1.2px;"/>
    <text x="640" y="223" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">ldmatrix.x4 from the shared tiles: ONE instruction delivers 4</text>
    <text x="640" y="238" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">fragments — ~4× fewer fragment instructions for the same MMAs</text>

    <!-- row 3: S hand-off -->
    <rect x="44" y="270" width="148" height="60" rx="5" style="fill:rgb(248,250,252);stroke:rgb(203,213,225);stroke-width:1px;"/>
    <text x="56" y="296" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(51,65,85);">S hand-off</text>
    <text x="56" y="311" style="font-family:'ArialMT','Arial',sans-serif;font-size:10.5px;fill:rgb(148,163,184);">MMA → softmax</text>
    <rect x="202" y="270" width="416" height="60" rx="5" style="fill:rgb(251,253,255);stroke:rgb(191,219,254);stroke-width:1.2px;"/>
    <text x="214" y="291" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">S (f32) is spilled to shared, then BARRIER — the warp that</text>
    <text x="214" y="306" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">computed a k-tile of S is not the warp that owns those rows</text>
    <text x="214" y="321" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">for the softmax</text>
    <rect x="628" y="270" width="396" height="60" rx="5" style="fill:rgb(255,252,246);stroke:rgb(254,215,170);stroke-width:1.2px;"/>
    <text x="640" y="291" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">none: S stays in the MMA C-fragments, in registers; each warp</text>
    <text x="640" y="306" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">owns its query columns end-to-end</text>

    <!-- row 4: online softmax -->
    <rect x="44" y="338" width="148" height="74" rx="5" style="fill:rgb(248,250,252);stroke:rgb(203,213,225);stroke-width:1px;"/>
    <text x="56" y="370" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(51,65,85);">online softmax</text>
    <text x="56" y="385" style="font-family:'ArialMT','Arial',sans-serif;font-size:10.5px;fill:rgb(148,163,184);">running m, l</text>
    <rect x="202" y="338" width="416" height="74" rx="5" style="fill:rgb(251,253,255);stroke:rgb(191,219,254);stroke-width:1.2px;"/>
    <text x="214" y="359" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">warp-SERIAL: each warp walks its 8 rows one at a time — masked</text>
    <text x="214" y="374" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">read from shared, 5-shuffle max tree, expf, 5-shuffle sum tree —</text>
    <text x="214" y="389" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">tensor cores idle throughout; P (f16) is written back to shared,</text>
    <text x="214" y="404" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">then BARRIER</text>
    <rect x="628" y="338" width="396" height="74" rx="5" style="fill:rgb(255,252,246);stroke:rgb(254,215,170);stroke-width:1.2px;"/>
    <text x="640" y="359" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">in-register: expf runs directly on the C-tile accumulators,</text>
    <text x="640" y="374" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">max/sum take a few column shuffles, and the O-accumulator</text>
    <text x="640" y="389" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">rescale also stays in registers — no shared write, no barrier</text>

    <!-- row 5: V block arrives -->
    <rect x="44" y="420" width="148" height="60" rx="5" style="fill:rgb(248,250,252);stroke:rgb(203,213,225);stroke-width:1px;"/>
    <text x="56" y="444" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(51,65,85);">V block arrives</text>
    <rect x="202" y="420" width="416" height="60" rx="5" style="fill:rgb(251,253,255);stroke:rgb(191,219,254);stroke-width:1.2px;"/>
    <text x="214" y="441" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">no stage (falsified twice): V fragments are built from global</text>
    <text x="214" y="456" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">SINGLE-HALF strided loads — V is consumed key-major (stride</text>
    <text x="214" y="471" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">kv_dim), so there is no adjacent pair to load together</text>
    <rect x="628" y="420" width="396" height="60" rx="5" style="fill:rgb(255,252,246);stroke:rgb(254,215,170);stroke-width:1.2px;"/>
    <text x="640" y="441" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">same cp.async-staged tile as K; a Vᵀ fragment is ONE</text>
    <text x="640" y="456" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">ldmatrix_trans — the transpose comes free inside the load</text>

    <!-- row 6: O += P.V MMA -->
    <rect x="44" y="488" width="148" height="74" rx="5" style="fill:rgb(255,247,237);stroke:rgb(245,158,11);stroke-width:1.6px;"/>
    <text x="56" y="520" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(180,83,9);">O += P·V</text>
    <text x="56" y="535" style="font-family:'ArialMT','Arial',sans-serif;font-size:10.5px;fill:rgb(180,83,9);">tensor-core MMA</text>
    <rect x="202" y="488" width="416" height="74" rx="5" style="fill:rgb(251,253,255);stroke:rgb(191,219,254);stroke-width:1.2px;"/>
    <text x="214" y="509" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">per fragment: 4 shared reads bring P back (the round-trip's</text>
    <text x="214" y="524" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">return leg) + 4 single-half global reads build V — the mio</text>
    <text x="214" y="539" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">instruction-count wall (mio_throttle ~5 on both devices)</text>
    <rect x="628" y="488" width="396" height="74" rx="5" style="fill:rgb(255,252,246);stroke:rgb(254,215,170);stroke-width:1.2px;"/>
    <text x="640" y="509" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">P is already the B-fragment — a register re-type, zero memory</text>
    <text x="640" y="524" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">instructions (B[k] = get_half2(KQ_C[k])); V costs one</text>
    <text x="640" y="539" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">ldmatrix_trans per fragment</text>

    <!-- row 7: end of block -->
    <rect x="44" y="570" width="148" height="60" rx="5" style="fill:rgb(248,250,252);stroke:rgb(203,213,225);stroke-width:1px;"/>
    <text x="56" y="594" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(51,65,85);">end of block</text>
    <rect x="202" y="570" width="416" height="60" rx="5" style="fill:rgb(251,253,255);stroke:rgb(191,219,254);stroke-width:1.2px;"/>
    <text x="214" y="591" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">BARRIER, then back to the top — only now may the next K block</text>
    <text x="214" y="606" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">be touched; nothing was in flight during any of the steps above</text>
    <rect x="628" y="570" width="396" height="60" rx="5" style="fill:rgb(255,252,246);stroke:rgb(254,215,170);stroke-width:1.2px;"/>
    <text x="640" y="591" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">the next K block has been streaming in since the P·V began;</text>
    <text x="640" y="606" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(51,65,85);">the block-end barrier is a buffer swap, hidden by the pipeline</text>

    <!-- loop-back arrow, next block -->
    <path d="M44,600 L32,600 L32,164 L36,164" style="fill:none;stroke:rgb(148,163,184);stroke-width:1.5px;"/>
    <path d="M44,164 L36,160 L36,168 Z" style="fill:rgb(148,163,184);"/>
    <text transform="matrix(0,-1,1,0,26,436)" style="font-family:'ArialMT','Arial',sans-serif;font-size:10.5px;fill:rgb(148,163,184);">next K/V block</text>

    <!-- verdict strip -->
    <rect x="36" y="642" width="988" height="64" rx="6" style="fill:rgb(248,250,252);stroke:rgb(226,232,240);stroke-width:1px;"/>
    <text x="52" y="663" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:13px;fill:rgb(51,65,85);">Same MMA FLOPs on both sides — the 8× is the choreography around the MMAs, not the math.</text>
    <text x="52" y="681" style="font-family:'ArialMT','Arial',sans-serif;font-size:12px;fill:rgb(71,85,105);">Ours re-maps warp→data three times per block (k-tiles for S → rows for softmax → hd-slices for PV); every re-map is a shared round-trip + a barrier.</text>
    <text x="52" y="699" style="font-family:'ArialMT','Arial',sans-serif;font-size:12px;fill:rgb(71,85,105);">llama keeps one mapping — a warp owns its query columns throughout — so the score matrix never leaves registers and every load flies under the MMAs.</text>
    <circle cx="984" cy="674" r="26" style="fill:rgb(254,242,242);stroke:rgb(220,38,38);stroke-width:2px;"/>
    <text x="984" y="672" text-anchor="middle" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:18px;fill:rgb(220,38,38);">8×</text>
    <text x="984" y="686" text-anchor="middle" style="font-family:'ArialMT','Arial',sans-serif;font-size:8.5px;fill:rgb(185,28,28);">per pass</text>

    <!-- amber footnote: the two MMAs fail differently -->
    <rect x="36" y="716" width="988" height="62" rx="6" style="fill:rgb(255,251,240);stroke:rgb(245,158,11);stroke-width:1.6px;"/>
    <text x="52" y="737" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12px;fill:rgb(180,83,9);">Are S = Q·Kᵀ and O += P·V failing the same way? No.</text>
    <text x="396" y="737" style="font-family:'ArialMT','Arial',sans-serif;font-size:12px;fill:rgb(120,86,40);">Q·Kᵀ stalled on LATENCY — long_scoreboard 11.5 cyc/instr on the f32→f16 pack over per-fragment</text>
    <text x="52" y="754" style="font-family:'ArialMT','Arial',sans-serif;font-size:12px;fill:rgb(120,86,40);">global K loads — cured by K-staging (954 → 856 µs), then removed outright by the f16 rings. O += P·V is walled on memory-INSTRUCTION COUNT (mio_throttle ~5):</text>
    <text x="52" y="771" style="font-family:'ArialMT','Arial',sans-serif;font-size:12px;fill:rgb(120,86,40);">staging falsified twice (an LDS replaces an LDG one-for-one; mio counts both), pipelining exactly neutral; only GQA packing — fewer instructions — paid.</text>

    <!-- bottom stats + trade -->
    <text x="36" y="800" style="font-family:'ArialMT','Arial',sans-serif;font-size:12.5px;fill:rgb(71,85,105);">Prefill attention:</text>
    <text x="125.6" y="800" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12.5px;fill:rgb(15,23,42);">0.67 s</text>
    <text x="163.9" y="800" style="font-family:'ArialMT','Arial',sans-serif;font-size:12.5px;fill:rgb(71,85,105);">(ours) vs</text>
    <text x="215.9" y="800" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12.5px;fill:rgb(15,23,42);">0.08 s</text>
    <text x="254.2" y="800" style="font-family:'ArialMT','Arial',sans-serif;font-size:12.5px;fill:rgb(71,85,105);">(llama) per 929-token 12B pass on the Orin — ~40% of the whole 0.8× prefill gap, the single biggest slice.</text>
    <text x="36" y="820" style="font-family:'Arial-BoldMT','Arial',sans-serif;font-weight:700;font-size:12.5px;fill:rgb(51,65,85);">Why we can't just copy it:</text>
    <text x="204" y="820" style="font-family:'ArialMT','Arial',sans-serif;font-size:12.5px;fill:rgb(51,65,85);">it is their whole register/pipeline architecture — matching it means adopting their kernels wholesale; 0.8× is a priced trade.</text>
    <text x="36" y="840" style="font-family:'ArialMT','Arial',sans-serif;font-size:11.5px;fill:rgb(100,116,139);">(GQA head-packing was the one graftable slice, +1.7%; both columns pack 2 query heads per KV group. Sources: nsys/ncu, 2026-07 — prefill-performance-journal.md.)</text>
</svg>
